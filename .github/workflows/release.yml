name: Release

# Releases the "(unreleased)" version in CHANGELOG.md: its notes become a GitHub release, CHANGELOG.md
# keeps a link, and the release commit is tagged v<version>. The tarball is attached before the release is published,
# so immutable releases work. It points the formula in Zejnilovic/homebrew-tap at the tarball, and then installs the
# release from the tap and tests it. Start it from the Actions tab. A dry run does everything but push, and shows the
# notes and the formula.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Prepare the release and show the notes, but push nothing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    # Release only from the default branch, never from a feature branch.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.notes.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history and tags, so check.py can compare bin/, lib/ and share/ with the last release tag.
          fetch-depth: 0
      - name: Install the tools vaults expect
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ripgrep jq; else sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep jq; fi
      - name: Checks before release
        run: |
          python3 scripts/check.py
          python3 -m unittest discover -s tests
      - name: Move the notes out of CHANGELOG.md
        id: notes
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          version=$(python3 scripts/release.py --notes "$NOTES")
          { echo "VERSION=$version"; echo "NOTES=$NOTES"; } >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The summary keeps the notes, so a failed last step can be finished by hand:
          # make dist, then gh release create v<version> --verify-tag --title <version> --notes-file notes.md
          # dist/pkm-<version>.tar.gz dist/pkm-<version>.tar.gz.sha256
          { echo "## Release notes for $version"; echo; cat "$NOTES"; echo; echo '## CHANGELOG.md'; echo
            echo '```diff'; git diff CHANGELOG.md; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "Release $VERSION"
          git tag -a "v$VERSION" -m "Release $VERSION"
      - name: Checks after release
        run: python3 scripts/check.py
      - name: Push the commit and tag
        if: ${{ !inputs.dry_run }}
        run: git push --atomic origin "HEAD:$GITHUB_REF_NAME" "v$VERSION"
      - name: Build the tarball
        run: make dist
      # The release starts as a draft with the tarball attached, and is published after: an immutable release takes
      # no files once it is published.
      - name: Create the GitHub release with the tarball
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --verify-tag --draft --title "$VERSION" --notes-file "$NOTES" \
            "dist/pkm-$VERSION.tar.gz" "dist/pkm-$VERSION.tar.gz.sha256"
          gh release edit "v$VERSION" --draft=false
      - name: Write the formula
        run: |
          git clone -q --depth 1 https://github.com/Zejnilovic/homebrew-tap.git "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          sh scripts/formula.sh "dist/pkm-$VERSION.tar.gz" "$RUNNER_TEMP/tap/Formula/pkm.rb"
          # The summary keeps the formula, so a failed last step can be finished by hand.
          { echo '## Formula/pkm.rb in Zejnilovic/homebrew-tap'; echo; echo '```diff'
            git -C "$RUNNER_TEMP/tap" add -N Formula/pkm.rb
            git -C "$RUNNER_TEMP/tap" diff
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # HOMEBREW_TAP_TOKEN: a fine-grained token for Zejnilovic/homebrew-tap with contents write, as in agd.
      - name: Update the formula in the tap
        if: ${{ !inputs.dry_run }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add Formula/pkm.rb
          git commit -q -m "pkm $VERSION"
          git push -q "https://x-access-token:$TAP_TOKEN@github.com/Zejnilovic/homebrew-tap.git" HEAD

  verify:
    # Installs the new release the way people will, with its completions, and runs the formula's test.
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: macos-latest
    steps:
      - name: Install from the tap and test
        run: |
          brew tap zejnilovic/tap
          brew install zejnilovic/tap/pkm
          brew test zejnilovic/tap/pkm
          brew audit --strict --online zejnilovic/tap/pkm
          test "$(pkm version)" = "${{ needs.release.outputs.version }}"
          test -f "$(brew --prefix)/share/zsh/site-functions/_pkm"
          test -f "$(brew --prefix)/etc/bash_completion.d/pkm"
